name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 8 (OpenJDK 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Verify Java installation
        run: |
          export JRE_HOME=${JAVA_HOME}
          echo "JAVA_HOME: $JAVA_HOME"
          echo "JRE_HOME: $JRE_HOME"
          java -version

      - name: Download ant-contrib
        run: |
          mkdir -p ivy
          curl -L -o ivy/ant-contrib-1.0b3.jar \
            https://repo1.maven.org/maven2/ant-contrib/ant-contrib/1.0b3/ant-contrib-1.0b3.jar

      - name: Build with Ant
        run: |
          export JRE_HOME=${JAVA_HOME}
          ant jar -Dhadoopversion=2 -Dhbaseversion=1

      - name: Verify JAR was built
        run: |
          ls -la build/*.jar
          ls -la *.jar || true

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pig-jar
          path: |
            build/pig-*.jar
            pig-*.jar
          retention-days: 30

  deploy:
    name: Deploy to JFrog
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 8 (OpenJDK 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Extract version from build.xml
        id: version
        run: |
          # Extract pig.version and pig.version.suffix from build.xml
          PIG_VERSION=$(grep -oP 'name="pig.version" value="\K[^"]+' build.xml)
          PIG_SUFFIX=$(grep -oP 'name="pig.version.suffix" value="\K[^"]+' build.xml || echo "")
          FULL_VERSION="${PIG_VERSION}${PIG_SUFFIX}"
          echo "PIG_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Detected version: ${FULL_VERSION}"

      - name: Download ant-contrib
        run: |
          mkdir -p ivy
          curl -L -o ivy/ant-contrib-1.0b3.jar \
            https://repo1.maven.org/maven2/ant-contrib/ant-contrib/1.0b3/ant-contrib-1.0b3.jar

      - name: Build with Ant
        run: |
          export JRE_HOME=${JAVA_HOME}
          ant jar -Dhadoopversion=2 -Dhbaseversion=1

      - name: Generate POM file
        run: |
          cat > build/pig-23-withouthadoop-${PIG_VERSION}.pom << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" 
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>common</groupId>
            <artifactId>pig-23-withouthadoop</artifactId>
            <version>${PIG_VERSION}</version>
            <packaging>jar</packaging>
            <name>Apache Pig (Hadoop 2.3, without Hadoop)</name>
            <description>Apache Pig built for Hadoop 2.3 without bundled Hadoop libraries</description>
          </project>
          EOF
          echo "Generated POM file:"
          cat build/pig-23-withouthadoop-${PIG_VERSION}.pom

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        run: |
          # Upload the pig JAR
          jf rt upload \
            "build/pig-23-withouthadoop-${PIG_VERSION}.jar" \
            "sharelib-stg/common/pig-23-withouthadoop/${PIG_VERSION}/pig-23-withouthadoop-${PIG_VERSION}.jar" \
            --url=https://xplenty.jfrog.io/artifactory \
            --user=${{ secrets.JFROG_USERNAME }} \
            --password=${{ secrets.JFROG_PASSWORD }}
          
          # Upload the POM file
          jf rt upload \
            "build/pig-23-withouthadoop-${PIG_VERSION}.pom" \
            "sharelib-stg/common/pig-23-withouthadoop/${PIG_VERSION}/pig-23-withouthadoop-${PIG_VERSION}.pom" \
            --url=https://xplenty.jfrog.io/artifactory \
            --user=${{ secrets.JFROG_USERNAME }} \
            --password=${{ secrets.JFROG_PASSWORD }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        run: |
          # Upload the pig JAR
          jf rt upload \
            "build/pig-23-withouthadoop-${PIG_VERSION}.jar" \
            "sharelib/common/pig-23-withouthadoop/${PIG_VERSION}/pig-23-withouthadoop-${PIG_VERSION}.jar" \
            --url=https://xplenty.jfrog.io/artifactory \
            --user=${{ secrets.JFROG_USERNAME }} \
            --password=${{ secrets.JFROG_PASSWORD }}
          
          # Upload the POM file
          jf rt upload \
            "build/pig-23-withouthadoop-${PIG_VERSION}.pom" \
            "sharelib/common/pig-23-withouthadoop/${PIG_VERSION}/pig-23-withouthadoop-${PIG_VERSION}.pom" \
            --url=https://xplenty.jfrog.io/artifactory \
            --user=${{ secrets.JFROG_USERNAME }} \
            --password=${{ secrets.JFROG_PASSWORD }}
